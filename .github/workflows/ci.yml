name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: tsc smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dev deps
        run: bun install
      - name: Type-check plugins against the API stub
        run: bun run typecheck
